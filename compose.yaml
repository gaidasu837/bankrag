name: bankrag
services:
  neo4j:
    image: neo4j:2026.07.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${BANKRAG_PASSWORD:?Set BANKRAG_PASSWORD before starting}"
    volumes:
      - graph_data:/data
      - graph_logs:/logs
volumes:
  graph_data:
  graph_logs:
