<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>银行知识问答 · 证据阅读版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182738;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}header{background:#123b47;color:white;padding:28px max(24px,calc((100% - 1040px)/2))}header small{color:#b9d8db}h1{font-size:28px;margin:5px 0}main{max-width:1040px;margin:28px auto;padding:0 20px}.panel{background:white;padding:26px;border-radius:16px;border:1px solid #e0e6ed;margin-bottom:20px}textarea{width:100%;min-height:105px;border:1px solid #bbc8d2;border-radius:10px;padding:14px;font:inherit;resize:vertical}button{border:0;border-radius:8px;padding:11px 20px;font:inherit;cursor:pointer;background:#13716f;color:white}button:disabled{opacity:.5;cursor:wait}.samples{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.samples button{font-size:14px;background:#eaf2f3;color:#21595d;padding:7px 12px}.muted{font-size:14px;color:#657387}.notice{background:#fff4dd;padding:12px 16px;border-radius:8px;color:#72551d}.quote{border-left:4px solid #13716f;padding:12px 18px;background:#f1f8f7;white-space:pre-wrap}details{margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#096b82;overflow-wrap:anywhere}h2{font-size:21px;margin-top:0}h3{font-size:17px}.error{color:#a32432}.hidden{display:none}#progress{margin:12px 0}.tag{font-size:12px;border-radius:5px;background:#eaf2f3;padding:3px 8px}footer{color:#657387;text-align:center;font-size:13px;padding:20px}
</style>
<header><small>LOCAL KNOWLEDGE / 本地运行</small><h1>银行知识问答</h1><div>工行公开资料 · 每条回答均可查看原文出处</div></header>
<main><div class="panel"><h2>你想了解什么？</h2><p class="muted">试点范围：账户分类、Ⅰ类账户用途、整存整取相关服务。当前规则时效待核验。</p>
<form id="form"><label for="question">输入问题</label><textarea id="question" maxlength="400" placeholder="例如：整存整取部分提前支取如何计息？" required></textarea>
<div class="samples"><button type="button">个人银行结算账户分为哪几类？</button><button type="button">整存整取部分提前支取如何计息？</button><button type="button">定期存款可以约定转存吗？</button></div>
<button id="ask">检索并回答</button> <span class="muted">Qwen3 14B · CPU</span></form><div id="progress" role="status" aria-live="polite"></div></div>
<section id="answer" class="hidden panel" aria-live="polite"></section></main><footer>研究原型，非银行官方客服。原文匹配不等于现行规则认证。</footer>
<script>
const q=document.querySelector('#question'), button=document.querySelector('#ask'), progress=document.querySelector('#progress'), answer=document.querySelector('#answer');
document.querySelectorAll('.samples button').forEach(b=>b.onclick=()=>q.value=b.textContent);
function el(tag,text,parent,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;parent.append(n);return n}
function render(r){answer.replaceChildren();answer.classList.remove('hidden');el('h2',r.message,answer);if(r.status==='error')return;el('p',r.notice,answer,'notice');el('p',`用时 ${r.seconds} 秒 · 返回 ${r.evidence.length} 组原文`,answer,'muted');
for(const e of r.evidence){let c=el('article','',answer);el('h3',`[${e.id}] ${e.title}`,c);el('div',e.quote,c,'quote');if(e.condition)el('p','条件 / 情境：'+e.condition,c);for(const note of e.notes)el('p','审核说明：'+note,c,'muted');let a=el('a','查看官方页面',c);try{const u=new URL(e.source_url);if(u.protocol==='https:'&&u.hostname==='www.icbc.com.cn'){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}
el('p',`网页发布日期：${e.published_at||'未提供'} ｜ 采集：${e.retrieved_at} ｜ 时效：待核验`,c,'muted');let d=el('details','',c);el('summary','查看完整证据链',d);el('pre',JSON.stringify({relations:e.relations,assertion_ids:e.assertion_ids,chunk_id:e.chunk_id,version_id:e.version_id,quote:e.quote,start_char:e.start_char,end_char:e.end_char,source_url:e.source_url,raw_sha256:e.raw_hash,semantic_status:e.semantic_status,temporal_status:e.temporal_status},null,2),d)} }
document.querySelector('#form').onsubmit=async event=>{event.preventDefault();button.disabled=true;answer.classList.add('hidden');const start=Date.now();const timer=setInterval(()=>progress.textContent=`正在检索原文并等待本地模型… ${Math.floor((Date.now()-start)/1000)}秒。CPU推理可能需要数分钟。`,1000);try{let response=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});let r=await response.json();if(!response.ok)throw Error(r.message);const id=r.job_id;for(;;){await new Promise(resolve=>setTimeout(resolve,1500));response=await fetch('/api/jobs/'+id);r=await response.json();if(!response.ok)throw Error(r.message);if(r.status!=='running'){render(r);break}}progress.textContent='处理完成';}catch(e){progress.textContent=e.message;}finally{clearInterval(timer);button.disabled=false}};
</script></html>
